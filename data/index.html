<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kunugui - Controle de Relés</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f2f2f2;
        text-align: center;
      }

      h1 {
        margin-bottom: 20px;
      }

      .botoes {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
        margin-bottom: 20px;
      }

      button {
        font-size: 1rem;
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
      }

      button[data-estado='1'] {
        background-color: #4caf50;
        color: white;
      }

      button[data-estado='0'] {
        background-color: #f44336;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Kunugui - Controle de Relés</h1>

    <!-- Container para os botões dos relés -->
    <div class="botoes" id="botoes">Carregando estados...</div>

    <script>
      /**
       * Carrega os estados dos relés via API e cria os botões dinamicamente.
       */
      fetch('/api/estado')
        .then((res) => res.json())
        .then((data) => {
          const container = document.getElementById('botoes');
          container.innerHTML = '';
          for (let i = 1; i <= 4; i++) {
            const estado = data[`saida${i}`] ? '1' : '0';
            const btn = document.createElement('button');
            btn.textContent = `Relé ${i} ${estado === '1' ? 'ON' : 'OFF'}`;
            btn.dataset.estado = estado;

            // Define comportamento ao clicar no botão
            btn.onclick = () => {
              const novoEstado = btn.dataset.estado === '0' ? '1' : '0';
              fetch('/api/saida', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `id=${i}&estado=${novoEstado}`,
              }).then(() => {
                btn.dataset.estado = novoEstado;
                btn.textContent = `Relé ${i} ${
                  novoEstado === '1' ? 'ON' : 'OFF'
                }`;
              });
            };

            container.appendChild(btn);
          }
        });
    </script>
  </body>
</html>
